name: Hilal
options:
  bundleIdPrefix: app.hilal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Hilal:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Widgets
        excludes:
          - Widgets.swift
          - MatchActivity.swift
          - Info.plist
          - HilalWidgets.entitlements
          - ar.lproj
          - ar.lproj/**
          - en.lproj
          - en.lproj/**
      - path: Resources/Calli
        type: folder
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/ksa_cities.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hilal.widgets
        PRODUCT_NAME: Hilal
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Hilal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HilalWidgets
        embed: true
  HilalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Calli
        type: folder
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/ksa_cities.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hilal.widgets.ext
        PRODUCT_NAME: HilalWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/HilalWidgets.entitlements
        SKIP_INSTALL: "YES"
