name: UI crawl (every tap)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: crawl budget per tab (minutes)
        default: "55"
      tabs:
        description: tabs to crawl (JSON list)
        default: "[0, 1, 2, 3, 4]"
      runner:
        description: "macOS runner label"
        type: string
        default: macos-15

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        tab: ${{ fromJSON(inputs.tabs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Fetch AI model
        run: |
          python3 -m venv "$RUNNER_TEMP/hf" && "$RUNNER_TEMP/hf/bin/pip" install -q "huggingface_hub==0.26.2"   # بيئة معزولة: تعمل على أجهزة ARM وIntel
          "$RUNNER_TEMP/hf/bin/python" -c "from huggingface_hub import snapshot_download; snapshot_download('gyoom/UVR-MDX-CoreML', revision='aa27ab16896fdb298cdb73cceb76c950e7580c00', allow_patterns=['UVR_MDXNET_9482.mlpackage/*'], local_dir='Resources/Models')"
          rm -rf Resources/Models/.cache; ls Resources/Models || true
          # بدون النموذج تختفي ميزة «عزل الصوت» بصمت — نوقف البناء بدل ذلك
          test -f Resources/Models/UVR_MDXNET_9482.mlpackage/Manifest.json || { echo "::error::AI separation model missing"; exit 1; }
      - run: brew install xcodegen && xcodegen generate
      - name: Crawl
        continue-on-error: true
        timeout-minutes: 180
        run: |
          UDID=$(python3 ci/pick_sim.py)
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          xcrun simctl spawn $UDID defaults write -g AppleLanguages -array ar
          xcrun simctl spawn $UDID defaults write -g AppleLocale ar_SA
          xcrun simctl location $UDID set 24.4672,39.6111 || true
          TEST_RUNNER_CRAWL_TAB=${{ matrix.tab }} TEST_RUNNER_CRAWL_MIN=${{ github.event.inputs.minutes || '55' }} \
          xcodebuild test -project Hilal.xcodeproj -scheme Hilal -destination "id=$UDID" \
            -derivedDataPath uibuild CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            -only-testing:HilalUITests/CrawlTests > ui.log 2>&1 || true
          grep -E "CRAWL|error:" ui.log | tail -40
          xcrun simctl spawn $UDID log show --last 90m --style compact --predicate 'eventMessage CONTAINS "RFDBG" OR eventMessage CONTAINS "TVDBG" OR eventMessage CONTAINS[c] "attempt to present" OR (process == "Hilal" AND messageType == fault)' > applog.txt 2>&1 || true
          mkdir -p out && cp -R ~/uitest/crawl/* out/ 2>/dev/null || true
          cp applog.txt out/applog_${{ matrix.tab }}.txt; grep -E "CRAWL" ui.log > out/uilog_${{ matrix.tab }}.txt || true
          ls out | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-${{ matrix.tab }}
          path: out
  publish:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - run: |
          mkdir pub && cp -R all/*/* pub/ 2>/dev/null || true
          cd pub && git init -q && git checkout -q -b crawlout && git add -A && \
          git -c user.name=ci -c user.email=ci@local commit -qm "crawl" && \
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} crawlout
