name: Separation model (convert & publish)

# يحوّل نموذج BS-RoFormer (رخصة MIT) إلى Core ML وينشره في صفحة Releases ليُنزَّل داخل التطبيق.
# يُشغَّل يدويًا فقط. لا يحتوي على أي بيانات للمستخدم.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        type: string
        default: sep-model-v1

permissions:
  contents: write   # إنشاء الإصدار ورفع ملفات النموذج فقط

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate inputs
        run: |
          [[ "$TAG" =~ ^sep-model-v[0-9]+$ ]] || { echo "::error::bad tag"; exit 1; }
      - name: Install
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"
          pip install -q "coremltools==8.3.0" "numpy<2.2" einops==0.8.0 rotary-embedding-torch==0.8.6 beartype==0.19.0 safetensors==0.4.5 pyyaml packaging huggingface_hub==0.26.2
      - name: Fetch model code (ZFTurbo, MIT) and weights (viperx BS-RoFormer, MIT)
        run: |
          set -e
          M=tools/model/models/bs_roformer
          mkdir -p $M && touch tools/model/models/__init__.py $M/__init__.py
          SRC=https://raw.githubusercontent.com/ZFTurbo/Music-Source-Separation-Training/main
          curl -sSfL $SRC/models/bs_roformer/bs_roformer.py -o $M/bs_roformer.py
          curl -sSfL $SRC/models/bs_roformer/attend.py -o $M/attend.py
          curl -sSfL $SRC/LICENSE -o tools/model/LICENSE-ZFTurbo
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for f in ['bs_roformer/vocals_viperx/model.safetensors', 'bs_roformer/vocals_viperx/config.yaml', 'README.md']:
              print(hf_hub_download('AEmotionStudio/roformer-models', f, local_dir='w'))
          PY
          ls -la w/bs_roformer/vocals_viperx
          grep -i "license" w/README.md | head -3
      - name: Convert
        run: python tools/model/convert_bsroformer.py --config w/bs_roformer/vocals_viperx/config.yaml --weights w/bs_roformer/vocals_viperx/model.safetensors --out out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          P=out/BSRoformer.mlpackage
          cp "$P/Manifest.json" out/Manifest.json
          cp "$P/Data/com.apple.CoreML/model.mlmodel" out/model.mlmodel
          cp "$P/Data/com.apple.CoreML/weights/weight.bin" out/weight.bin
          cat > out/NOTICE.txt <<'TXT'
          BS-RoFormer vocal separation model converted to Core ML for the Rafiqi app.
          Weights: viperx BS-RoFormer (vocals), MIT License, via huggingface.co/AEmotionStudio/roformer-models.
          Architecture code: ZFTurbo/Music-Source-Separation-Training, MIT License (Roman Solovyev).
          Paper: Lu et al., "Music Source Separation with Band-Split RoPE Transformer" (2023).
          TXT
          gh release create "$TAG" --title "Separation model ($TAG)" --notes-file out/NOTICE.txt \
            out/Manifest.json out/model.mlmodel out/weight.bin out/files.json out/NOTICE.txt
          cat out/files.json
