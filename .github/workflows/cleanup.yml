name: One-time cleanup (delete leftover unencrypted artifacts)
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all stored artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          n=0; for id in $ids; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && n=$((n+1)); done
          echo "deleted $n artifacts"
          left=$(gh api "repos/$REPO/actions/artifacts?per_page=1" --jq '.total_count'); echo "left: $left"
          test "$left" = "0"
