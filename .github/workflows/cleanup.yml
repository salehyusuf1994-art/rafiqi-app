name: One-time cleanup (delete public output branches and old artifacts)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete output branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in out uiout launchout crawlout linksout; do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" && echo "deleted $b" || echo "missing $b"
          done
      - name: Delete all stored artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          n=0; for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && n=$((n+1)); done
          echo "deleted $n artifacts"
          left=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=1" --jq '.total_count'); echo "left: $left"
