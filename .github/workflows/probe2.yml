name: Probe streams
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          K=https://live.kwikmotion.com
          python3 ci/probe_hls.py $K/sbrksaquranradiolive/srpksaquranradio/playlist.m3u8 $K/sbrksariyadhradiolive/ksariyadhradio/chunks.m3u8 $K/sbrksariyadhradiolive/srpksariyadhradio/playlist.m3u8 $K/sbrksajeddahradiolive/ksajeddahradio/chunks.m3u8 $K/sbrksanedaradiolive/srpksanedaradio/playlist.m3u8 $K/sbrksanedaradiolive/ksanedaradio/chunks.m3u8 $K/sbrksasaudiaradiolive/ksasaudiaradio/chunks.m3u8 $K/sbrksakhuzamaradiolive/khuzama/chunks.m3u8 $K/sbrksaekhbariyaradiolive/ksaekhbariyaradio/chunks.m3u8 $K/sbrksaekhbariyaradiolive/srpksaekhbariyaradio/playlist.m3u8 $K/sbrksaalekhbariyaradiolive/ksaalekhbariyaradio/chunks.m3u8 $K/sbrksanewsradiolive/ksanewsradio/chunks.m3u8
          for n in panorama radiopanorama panoramafm rpanorama kasserine radiokasserine kasserin elkasserine radiokasserin; do
            for b in https://radio.radiotunisienne.tn http://rtstream.tanitweb.com; do
              printf "%s %s/%s\n" "$(curl -s -o /dev/null -r 0-2047 -m 6 -w '%{http_code}' $b/$n || true)" $b $n
            done
          done
