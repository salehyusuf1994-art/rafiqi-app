name: Launch test (Release build, simulator)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label (use macos-15-intel when arm64 runners are saturated)"
        type: string
        default: macos-15

permissions:
  contents: write

jobs:
  launch:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Fetch AI model
        run: |
          python3 -m venv "$RUNNER_TEMP/hf" && "$RUNNER_TEMP/hf/bin/pip" install -q "huggingface_hub==0.26.2"   # بيئة معزولة: تعمل على أجهزة ARM وIntel
          "$RUNNER_TEMP/hf/bin/python" -c "from huggingface_hub import snapshot_download; snapshot_download('gyoom/UVR-MDX-CoreML', revision='aa27ab16896fdb298cdb73cceb76c950e7580c00', allow_patterns=['UVR_MDXNET_9482.mlpackage/*'], local_dir='Resources/Models')"
          rm -rf Resources/Models/.cache
          # بدون النموذج تختفي ميزة «عزل الصوت» بصمت — نوقف البناء بدل ذلك
          test -f Resources/Models/UVR_MDXNET_9482.mlpackage/Manifest.json || { echo "::error::AI separation model missing"; exit 1; }
      - run: brew install xcodegen && xcodegen generate
      - name: Build Release for simulator, launch, collect crashes
        continue-on-error: true
        run: |
          mkdir -p lout
          UDID=$(python3 ci/pick_sim.py)
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          xcrun simctl spawn $UDID defaults write -g AppleLanguages -array ar
          xcrun simctl spawn $UDID defaults write -g AppleLocale ar_SA
          xcodebuild -project Hilal.xcodeproj -scheme Hilal -configuration Release -destination "id=$UDID" \
            -derivedDataPath rbuild CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build > lout/build.log 2>&1 || { grep -E "error:" lout/build.log | head; }
          APP=$(ls -d rbuild/Build/Products/Release-iphonesimulator/Hilal.app)
          xcrun simctl install $UDID "$APP"
          for i in 1 2 3; do
            xcrun simctl launch --console-pty $UDID app.hilal.widgets > lout/console_$i.txt 2>&1 &
            sleep 25
            xcrun simctl io $UDID screenshot lout/launch_$i.png || true
            xcrun simctl spawn $UDID launchctl list | grep -i hilal > lout/running_$i.txt || echo "NOT RUNNING" > lout/running_$i.txt
            cat lout/running_$i.txt
            xcrun simctl terminate $UDID app.hilal.widgets || true
            sleep 3
          done
          cp ~/Library/Logs/DiagnosticReports/Hilal* lout/ 2>/dev/null || true
          ls ~/Library/Logs/DiagnosticReports/ | tail -20
          xcrun simctl spawn $UDID log show --last 15m --style compact --predicate 'process == "Hilal"' > lout/applog.txt 2>&1 || true
          grep -i -E "fatal|crash|exception|terminat|assert|abort" lout/applog.txt | head -40
          ls lout
      - name: Publish
        run: |
          mkdir -p pub && cd pub && git init -q && git checkout -q -b launchout
          cp -R ../lout/* . 2>/dev/null || true
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "launch test" && \
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} launchout
      - name: Verdict
        if: always()
        run: |
          # كل دليل يجب أن يكون موجودًا: غياب ملف (فشل التثبيت مثلًا) فشلٌ لا نجاح
          test -f lout/build.log || { echo "::error::no build log"; exit 1; }
          grep -q "BUILD SUCCEEDED" lout/build.log || { echo "::error::Release build failed"; grep -E "error:" lout/build.log | head; exit 1; }
          for i in 1 2 3; do
            test -f lout/running_$i.txt || { echo "::error::launch $i never ran"; exit 1; }
            # سطر launchctl يبدأ برقم العملية (PID) إن كانت تعمل فعلًا
            grep -qE "^[0-9]+[[:space:]]" lout/running_$i.txt || { echo "::error::app not running after launch $i"; cat lout/running_$i.txt; exit 1; }
          done
          if ls lout/Hilal* >/dev/null 2>&1; then echo "::error::crash report found"; ls lout/Hilal*; exit 1; fi
          echo "app launched and stayed running 3/3"
