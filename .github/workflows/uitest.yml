name: UI test (simulator)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label (use macos-15-intel when arm64 runners are saturated)"
        type: string
        default: macos-15
      tests:
        description: "Tests to run (-only-testing)"
        type: string
        default: HilalUITests/TVTapTests
      video:
        description: "Record the simulator screen while the tests run"
        type: boolean
        default: false

permissions:
  contents: write  # يرفع مخرجات مشفّرة فقط (ci/seal.sh)

jobs:
  uitest:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: ${{ inputs.runner == 'macos-15-intel' && 240 || 150 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (مثبّت بالبصمة)
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0 (مثبّت بالبصمة)
        with:
          xcode-version: latest-stable
      - name: Fetch AI model
        run: |
          python3 -m venv "$RUNNER_TEMP/hf" && "$RUNNER_TEMP/hf/bin/pip" install -q "huggingface_hub==0.26.2"   # بيئة معزولة: تعمل على أجهزة ARM وIntel
          "$RUNNER_TEMP/hf/bin/python" -c "from huggingface_hub import snapshot_download; snapshot_download('gyoom/UVR-MDX-CoreML', revision='aa27ab16896fdb298cdb73cceb76c950e7580c00', allow_patterns=['UVR_MDXNET_9482.mlpackage/*'], local_dir='Resources/Models')" || echo "model download failed"
          rm -rf Resources/Models/.cache; ls Resources/Models || true
      - run: brew install xcodegen && xcodegen generate
      - name: Run UI test
        continue-on-error: true
        env:
          ONLY: ${{ inputs.tests || 'HilalUITests/TVTapTests' }}
          VIDEO: ${{ inputs.video }}
        run: |
          UDID=$(python3 ci/pick_sim.py)
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          xcrun simctl spawn $UDID defaults write -g AppleLanguages -array ar
          xcrun simctl spawn $UDID defaults write -g AppleLocale ar_SA
          xcodebuild build-for-testing -project Hilal.xcodeproj -scheme Hilal -destination "id=$UDID" \
            -derivedDataPath uibuild CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build.log 2>&1 || { grep -E "error:" build.log | head -30; }
          mkdir -p uiout
          if [ "$VIDEO" = "true" ]; then
            xcrun simctl io $UDID recordVideo --codec h264 --force uiout/run.mp4 > /dev/null 2>&1 &
            REC=$!; sleep 2
          fi
          xcodebuild test-without-building -project Hilal.xcodeproj -scheme Hilal -destination "id=$UDID" \
            -derivedDataPath uibuild \
            -only-testing:"$ONLY" > ui.log 2>&1 && echo 0 > ui.rc || echo $? > ui.rc
          if [ -n "${REC:-}" ]; then kill -INT $REC || true; wait $REC || true; ls -la uiout/run.mp4 || true; fi
          grep -E "error:" build.log | head -20 >> ui.log || true
          grep -E "TVTEST|error:|Test Case|passed|failed" ui.log | head -80
          xcrun simctl spawn $UDID log show --last 70m --style compact --predicate 'eventMessage CONTAINS "TVDBG" OR eventMessage CONTAINS "RFDBG" OR eventMessage CONTAINS "SEPTEST" OR eventMessage CONTAINS[c] "attempt to present" OR eventMessage CONTAINS[c] "presentation" OR eventMessage CONTAINS "_UIReparentingView"' > applog.txt 2>&1 || true
          echo "SwiftUI reparenting warnings: $(grep -c "_UIReparentingView" applog.txt || true)"
          grep -E "TVDBG|RFDBG|SEPTEST|present" applog.txt | head -80
          mkdir -p uiout && cp applog.txt uiout/ || true
          mkdir -p uiout && cp -R ~/uitest/* uiout/ 2>/dev/null || true
          cp ui.log uiout/ ; ls uiout
      - name: Seal outputs (encrypted; only the owner's private key opens them)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/seal.sh uiout uiout
      - name: Verdict
        if: always()
        run: |
          grep -q "Executed" ui.log || { echo "::error::UI tests did not run (build failed)"; grep -E "error:" ui.log | head; exit 1; }
          if grep -qE "Test Case .* failed" ui.log; then echo "::error::UI test failures"; grep -E "Test Case .* failed" ui.log; exit 1; fi
          # رمز خروج xcodebuild نفسه: أي فشل لم يظهر في الأسطر أعلاه (انهيار، مهلة) يوقف الحكم
          test "$(cat ui.rc 2>/dev/null)" = "0" || { echo "::error::xcodebuild test exited with $(cat ui.rc 2>/dev/null)"; tail -30 ui.log; exit 1; }
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" ui.log || { echo "::error::no TEST SUCCEEDED"; exit 1; }
          echo "all UI tests passed"
