name: UI test (simulator)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uitest:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Run UI test
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']]
          p=[x for x in c if 'Pro Max' in x['name']] or c
          print(p[-1]['udid'])")
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          xcrun simctl spawn $UDID defaults write -g AppleLanguages -array ar
          xcrun simctl spawn $UDID defaults write -g AppleLocale ar_SA
          xcodebuild test -project Hilal.xcodeproj -scheme Hilal -destination "id=$UDID" \
            -derivedDataPath uibuild CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            -only-testing:HilalUITests/TVTapTests > ui.log 2>&1 || true
          grep -E "TVTEST|error:|Test Case|passed|failed" ui.log | head -80
          xcrun simctl spawn $UDID log show --last 15m --style compact --predicate 'eventMessage CONTAINS "TVDBG" OR eventMessage CONTAINS[c] "attempt to present" OR eventMessage CONTAINS[c] "presentation"' > applog.txt 2>&1 || true
          grep -E "TVDBG|present" applog.txt | head -40
          mkdir -p uiout && cp applog.txt uiout/ || true
          mkdir -p uiout && cp -R ~/uitest/* uiout/ 2>/dev/null || true
          cp ui.log uiout/ ; ls uiout
      - name: Publish
        run: |
          mkdir -p pub && cd pub && git init -q && git checkout -q -b uiout
          cp -R ../uiout/* . 2>/dev/null || true
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "ui test" && \
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} uiout
